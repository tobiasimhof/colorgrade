<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fotografie · Tobias Imhof</title>
  <meta name="description" content="Sportfotografie: Amateurfußball für das Portal FuPa." />
  <!-- Link-Vorschau: Karte mit Bild, wenn der Link per Mail, Messenger oder Teams
       geteilt wird. Die Adressen muessen absolut sein, sonst findet der Dienst das Bild nicht. -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="de_DE" />
  <meta property="og:site_name" content="Tobias Imhof" />
  <meta property="og:title" content="Fotografie · Tobias Imhof" />
  <meta property="og:description" content="Sportfotografie: Amateurfußball für das Portal FuPa." />
  <meta property="og:url" content="https://tobiasimhof.github.io/colorgrade/fotografie.html" />
  <meta property="og:image" content="https://tobiasimhof.github.io/colorgrade/assets/og/fotografie.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Zwei Fußballspieler im Laufduell um den Ball" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#1c1c1e" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <!-- Schrift vorladen: sonst findet der Browser sie erst, wenn das CSS geparst ist. -->
  <link rel="preload" href="assets/fonts/archivo-wdth-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <header class="site-hd">
    <div class="hd-in">
      <a class="brand" href="index.html">ColorGrade</a>
      <nav class="site-nav" aria-label="Bereiche">
        <a href="fotografie.html" aria-current="page">Fotografie</a>
        <a href="video.html">Videografie</a>
        <a href="app/index.html">Apps</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1 class="page-h">Fotografie</h1>
    <p class="lead">Amateurfußball an Spieltagen, aufgenommen für das Sportportal FuPa. Nikon D3400, Telezoom.</p>

    <!-- Bilder liegen als WebP in assets/img/, erzeugt von scripts/make_photos.py:
         NAME.webp = 1600 px fuer die Lightbox, NAME-t.webp = 800 px fuer die Kachel.
         Das breite Bild (figure.wide) fuellt die Satzbreite und hat deshalb keine
         eigene Kachel, es nimmt die 1600er Fassung. Jedes img traegt width/height,
         damit die Seite beim Nachladen nicht springt. -->

    <!-- Aufmacher: das Querformat zuerst, es zieht den Blick und laesst den
         beiden Hochformat-Reihen darunter Ruhe. Ohne Ueberschrift mit Absicht. -->
    <div class="shots" id="galLead">
      <figure class="wide">
        <button class="shot" type="button"
                data-full="assets/img/spieltag-konter.webp"
                data-title="Lauf in den freien Raum"
                data-sub="160 mm, 1/1000 s, f/5,3">
          <img src="assets/img/spieltag-konter.webp" width="1600" height="899" fetchpriority="high" decoding="async"
               alt="Weite Einstellung: ein Spieler führt den Ball, ein Gegenspieler verfolgt ihn." />
        </button>
        <figcaption>Lauf in den freien Raum · 160 mm, weite Einstellung</figcaption>
      </figure>
    </div>

    <h2 class="sec-h">Der Moment</h2>
    <div class="shots" id="galA">
      <figure>
        <button class="shot" type="button"
                data-full="assets/img/spieltag-schuss.webp"
                data-title="Ausholen zum Schuss"
                data-sub="135 mm, 1/1000 s, f/5,6">
          <img src="assets/img/spieltag-schuss-t.webp" width="640" height="800" loading="lazy" decoding="async"
               alt="Fußballspieler in blauem Trikot holt zum Schuss aus, zwei Gegenspieler laufen heran." />
        </button>
        <figcaption>Ausholen zum Schuss · 135 mm, 1/1000 s</figcaption>
      </figure>

      <figure>
        <button class="shot" type="button"
                data-full="assets/img/spieltag-zweikampf.webp"
                data-title="Zweikampf um den Ball"
                data-sub="102 mm, 1/3200 s, f/5,6">
          <img src="assets/img/spieltag-zweikampf-t.webp" width="640" height="800" loading="lazy" decoding="async"
               alt="Zwei Spieler kämpfen Schulter an Schulter um den Ball, im Hintergrund der Torwart." />
        </button>
        <figcaption>Zweikampf um den Ball · 102 mm, 1/3200 s</figcaption>
      </figure>
    </div>

    <h2 class="sec-h">Die Menschen</h2>
    <div class="shots" id="galB">
      <figure>
        <button class="shot" type="button"
                data-full="assets/img/torwart-jubel.webp"
                data-title="Faustgruß am Spielfeld"
                data-sub="200 mm, 1/1000 s, f/6,3">
          <img src="assets/img/torwart-jubel-t.webp" width="639" height="800" loading="lazy" decoding="async"
               alt="Lachender Torwart im orangefarbenen Trikot beim Faustgruß." />
        </button>
        <figcaption>Faustgruß am Spielfeld · 200 mm, offene Blende</figcaption>
      </figure>

      <figure>
        <button class="shot" type="button"
                data-full="assets/img/trainer.webp"
                data-title="Coaching von der Seitenlinie"
                data-sub="180 mm, 1/2000 s, f/5,6">
          <img src="assets/img/trainer-t.webp" width="640" height="800" loading="lazy" decoding="async"
               alt="Trainer in blauer Regenjacke ruft Anweisungen aufs Feld." />
        </button>
        <figcaption>Coaching von der Seitenlinie · 180 mm</figcaption>
      </figure>
    </div>

    <!-- Eigener Abschnitt statt drittes Bild bei den Menschen: Ein Portraet ist
         geplante Arbeit, keine Reportage, und drei Bilder wuerden in der
         zweispaltigen Reihe eine Luecke lassen. .shots.solo deckelt die Breite
         auf 420 px, damit es so gross wirkt wie eine Kachel der anderen Reihen. -->
    <h2 class="sec-h">Das Porträt</h2>
    <div class="shots solo" id="galC">
      <figure>
        <button class="shot" type="button"
                data-full="assets/img/spielerportraet.webp"
                data-title="Spielerporträt"
                data-sub="82 mm, 1/80 s, f/4,2">
          <img src="assets/img/spielerportraet-t.webp" width="640" height="800" loading="lazy" decoding="async"
               alt="Fußballspieler im blauen Vereinstrikot mit verschränkten Armen vor unscharfem Grün." />
        </button>
        <figcaption>Spielerporträt · 82 mm bei f/4,2, offene Blende für den ruhigen Hintergrund</figcaption>
      </figure>
    </div>

    <!-- Schlussbild. Im Querformat entstanden, nimmt also die volle Satzbreite
         wie der Aufmacher. Der urspruengliche Plan, es als 4:5 neben das
         Portraet zu stellen, ist damit hinfaellig: Eine Mannschaft gehoert ins
         Querformat, und als breiter Schlusspunkt schliesst sie die Strecke. -->
    <h2 class="sec-h">Die Mannschaft</h2>
    <div class="shots" id="galD">
      <figure class="wide">
        <button class="shot" type="button"
                data-full="assets/img/mannschaft.webp"
                data-title="Die Mannschaft"
                data-sub="25 mm, 1/50 s, f/6,3, ISO 6400">
          <img src="assets/img/mannschaft.webp" width="1600" height="900" loading="lazy" decoding="async"
               alt="Mannschaftsfoto unter Flutlicht: drei Reihen Spieler in blauen Trikots vor dem Tor." />
        </button>
        <figcaption>Die Mannschaft unter Flutlicht · 25 mm, 1/50 s bei ISO 6400</figcaption>
      </figure>
    </div>
  </main>

  <!-- Lightbox: ein einziges Overlay fuer alle Galerien der Seite. -->
  <div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Bildansicht">
    <div class="lb-bar">
      <span class="lb-count" id="lbCount"></span>
      <button class="lb-btn" type="button" id="lbPrev" aria-label="Vorheriges Bild">&#8249;</button>
      <button class="lb-btn" type="button" id="lbNext" aria-label="Nächstes Bild">&#8250;</button>
      <button class="lb-btn" type="button" id="lbClose" aria-label="Schließen">&#10005;</button>
    </div>
    <figure class="lb-fig">
      <img id="lbImg" src="" alt="" />
      <figcaption class="lb-cap" id="lbCap"></figcaption>
    </figure>
  </div>

  <footer class="site-ft">
    <div class="ft-in">
      <a href="index.html">Zurück zur Übersicht</a>
    </div>
  </footer>

  <script>
    (function () {
      var shots = Array.prototype.slice.call(document.querySelectorAll('.shot'));
      if (!shots.length) return;

      var lb = document.getElementById('lb');
      var img = document.getElementById('lbImg');
      var cap = document.getElementById('lbCap');
      var count = document.getElementById('lbCount');
      var btnPrev = document.getElementById('lbPrev');
      var btnNext = document.getElementById('lbNext');
      var btnClose = document.getElementById('lbClose');
      var i = 0;
      var zurueck = null; // Element, das den Fokus vor dem Oeffnen hatte

      function zeige(n) {
        i = (n + shots.length) % shots.length;
        var b = shots[i];
        var klein = b.querySelector('img');
        img.src = b.getAttribute('data-full');
        img.alt = klein ? klein.alt : '';
        cap.innerHTML = '<b></b>';
        cap.firstChild.textContent = b.getAttribute('data-title') || '';
        cap.appendChild(document.createTextNode(b.getAttribute('data-sub') || ''));
        count.textContent = (i + 1) + ' von ' + shots.length;
      }

      function oeffne(n) {
        zurueck = document.activeElement;
        zeige(n);
        lb.hidden = false;
        document.body.style.overflow = 'hidden';
        btnClose.focus();
      }

      function schliesse() {
        lb.hidden = true;
        document.body.style.overflow = '';
        img.src = '';
        if (zurueck && zurueck.focus) zurueck.focus();
      }

      shots.forEach(function (b, n) {
        b.addEventListener('click', function () { oeffne(n); });
      });
      btnPrev.addEventListener('click', function () { zeige(i - 1); });
      btnNext.addEventListener('click', function () { zeige(i + 1); });
      btnClose.addEventListener('click', schliesse);

      // Klick auf den Hintergrund schliesst, Klick auf Bild oder Leiste nicht.
      lb.addEventListener('click', function (e) {
        if (e.target === lb || e.target.classList.contains('lb-fig')) schliesse();
      });

      document.addEventListener('keydown', function (e) {
        if (lb.hidden) return;
        if (e.key === 'Escape') schliesse();
        else if (e.key === 'ArrowLeft') zeige(i - 1);
        else if (e.key === 'ArrowRight') zeige(i + 1);
        else if (e.key === 'Tab') {
          // Fokus im Overlay halten: nur die drei Schaltflaechen sind erreichbar.
          var f = [btnPrev, btnNext, btnClose];
          var pos = f.indexOf(document.activeElement);
          if (pos === -1) pos = 0;
          else pos = e.shiftKey ? pos - 1 : pos + 1;
          f[(pos + f.length) % f.length].focus();
          e.preventDefault();
        }
      });
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
    }
  </script>

</body>
</html>
