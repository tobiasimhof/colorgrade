<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ColorGrade</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1c1c1e" />
  <!-- Bis v71 lagen hier auch das Portfolio und die App unter app/. Alte Links
       (Lebenslauf, Lesezeichen, installierte App) landen jetzt auf dieser Seite
       und werden weitergeleitet: Portfolio-Seiten ins Repo Portfolio, app/ auf
       die Wurzel. Alles andere bekommt einen Link zur App. -->
  <script>
    (function () {
      var p = location.pathname.replace(/^\/colorgrade\/?/i, '');
      var portfolio = 'https://tobiasimhof.github.io/Portfolio/';
      var ziel = null;
      if (/^app(\/|$)/i.test(p)) ziel = '/colorgrade/';
      else if (/^(fotografie|video)\.html$/i.test(p)) ziel = portfolio + p.toLowerCase();
      else if (/^apps\.html$/i.test(p)) ziel = '/colorgrade/';
      if (ziel) location.replace(ziel + location.hash);
    })();
  </script>
  <style>
    html, body { margin: 0; background: #131315; color: #f2f2f4; }
    body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 48px 20px; max-width: 520px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #a0a0a8; margin: 0 0 16px; }
    a { color: #f2f2f4; }
  </style>
</head>
<body>
  <h1>Diese Seite gibt es nicht</h1>
  <p>Die Adresse ist falsch oder veraltet.</p>
  <p><a href="/colorgrade/">Zu ColorGrade</a></p>
</body>
</html>
